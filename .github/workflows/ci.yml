name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift 6.4, Xcode 27
            runner: xcode-27
            xcode: '27.0'
            swift: '6\.([4-9]|[1-9][0-9])'
          - name: Swift 6.3, Xcode 26.6
            runner: macos-26
            xcode: '26.6'
            swift: '6\.3'
          - name: Swift 6.1, Xcode 16.4 (oldest supported)
            runner: macos-15
            xcode: '16.4'
            swift: '6\.1'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Check the toolchain
        # Fails if the runner image changed and this job no longer tests the Swift it's named after.
        run: |
          swift --version
          swift --version 2>&1 | grep -E "Swift version ${{ matrix.swift }}"
      - name: Build every product
        run: swift build --build-tests
      - name: Test
        run: swift test --enable-code-coverage

  test-newest-swift-syntax:
    name: Test (newest swift-syntax)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - run: swift --version
      - name: Resolve newest dependencies
        run: |
          swift package update
          swift package show-dependencies
      - name: Test macros
        run: swift test --filter SwiftMoLoggerMacrosTests

  build:
    name: Build (${{ matrix.destination }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=macOS,variant=Mac Catalyst
          - generic/platform=tvOS
          - generic/platform=watchOS
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Use the package, not the stale root workspace
        # SwiftMoLogger.xcworkspace hides the package's schemes from xcodebuild.
        run: mv SwiftMoLogger.xcworkspace "$RUNNER_TEMP/"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SwiftMoLogger-Package \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO -quiet

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - run: swiftlint lint --reporter github-actions-logging

  docs:
    name: Documentation
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Use the package, not the stale root workspace
        # SwiftMoLogger.xcworkspace hides the package's schemes from xcodebuild.
        run: mv SwiftMoLogger.xcworkspace "$RUNNER_TEMP/"
      - name: Build DocC archive
        run: |
          xcodebuild docbuild -scheme SwiftMoLogger-Package -destination 'generic/platform=iOS' \
            -derivedDataPath .build/docc CODE_SIGNING_ALLOWED=NO -quiet
