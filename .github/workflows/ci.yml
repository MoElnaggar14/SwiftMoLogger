name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS, SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Build every product
        run: swift build --build-tests
      - name: Test
        run: swift test --enable-code-coverage

  test-newest-swift-syntax:
    name: Test (newest swift-syntax)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve newest dependencies
        run: |
          swift package update
          swift package show-dependencies
      - name: Test macros
        run: swift test --filter SwiftMoLoggerMacrosTests

  build:
    name: Build (${{ matrix.destination }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=macOS,variant=Mac Catalyst
          - generic/platform=tvOS
          - generic/platform=watchOS
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Use the package, not the stale root workspace
        # SwiftMoLogger.xcworkspace hides the package's schemes from xcodebuild.
        run: mv SwiftMoLogger.xcworkspace "$RUNNER_TEMP/"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SwiftMoLogger-Package \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO -quiet

  example-app:
    name: Build example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ExampleApp/SwiftMoLoggerExample.xcodeproj \
            -scheme SwiftMoLoggerExample \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - run: swiftlint lint --reporter github-actions-logging

  docs:
    name: Documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Use the package, not the stale root workspace
        # SwiftMoLogger.xcworkspace hides the package's schemes from xcodebuild.
        run: mv SwiftMoLogger.xcworkspace "$RUNNER_TEMP/"
      - name: Build DocC archive
        run: |
          xcodebuild docbuild -scheme SwiftMoLogger-Package -destination 'generic/platform=iOS' \
            -derivedDataPath .build/docc CODE_SIGNING_ALLOWED=NO -quiet
